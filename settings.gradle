pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Official Linphone Android SDK repository (the old linphone.org alias was retired).
        maven { url 'https://download.linphone.org/releases/android/maven_repository/' }
    }
}
rootProject.name = "Rean Dialer"
include ':app'
