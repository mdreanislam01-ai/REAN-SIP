name: Build Rean Dialer APK

on:
  push:
    branches: [arena/d19811d2-rean-sip, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Android SDK ready"

      - name: Install Gradle 8.10.2
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.10.2/bin/gradle --version

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon > build.log 2>&1
          RESULT=$?
          cat build.log
          if [ "$RESULT" -ne 0 ]; then
            # Mirror the useful tail into a check annotation, so compilation errors
            # remain visible even when GitHub's raw Actions log is unavailable.
            DETAILS=$(tail -n 45 build.log | tr '\n' ' ' | sed 's/::/: :/g')
            echo "::error title=Gradle build failure::$DETAILS"
            exit "$RESULT"
          fi

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK" "artifacts/ReanDialer-v1.0.0-build${{ github.run_number }}.apk"
          cd artifacts && sha256sum *.apk > checksums.sha256 && ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReanDialer-debug-build${{ github.run_number }}
          path: artifacts/
          retention-days: 30

      - name: Publish rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest artifacts/*.apk artifacts/checksums.sha256 \
            --title "Rean Dialer — latest dev build (#$GITHUB_RUN_NUMBER)" \
            --notes "Automated APK build from commit $GITHUB_SHA (branch: $GITHUB_REF_NAME). Verify the download with checksums.sha256." || true
