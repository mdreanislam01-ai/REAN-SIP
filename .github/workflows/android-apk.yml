name: Build CallerX APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'CallerX.html'
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 25 build.log
            summary=$(grep -E -i -A2 -B1 'e: |error:|unresolved reference|type mismatch|cannot infer|overload resolution|not enough information|cannot access|what went wrong|execution failed' build.log | head -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::$summary"
            exit "$result"
          fi
          tail -n 25 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CallerX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callerx-v1.5.11
          name: CallerX Android APK v1.5.11
          target_commitish: ${{ github.sha }}
          body: |
            Installable CallerX Android debug APK.

            v1.5.11 — Lock-screen mic, network drops, search & dialpad (Google Dialer style):
            - SIP engine now lives in the foreground service (microphone type), not in the
              Activity, so locking the phone, minimising the app or the system killing the
              Activity no longer kills the call or the microphone. Incoming SIP calls show a
              full-screen call UI over the lock screen and can be answered from there.
            - Audio focus + MODE_IN_COMMUNICATION + wake/Wi-Fi locks are held from the first
              ring until the call ends; Bluetooth / wired headset audio routing is honoured.
            - SIP re-registers automatically after reboot (boot receiver) and on every
              Wi-Fi/mobile switch; keepalive tightened to 15 s, registration refresh every
              5 minutes, and Opus switched to mono 16 kHz so calls survive weak 4G.
            - Search bar fixed: text keyboard on every tab (was numeric on Calls, so names
              could not be typed), auto-focus, +880/880/00/0 number equivalence, and real
              T9 keypad search (type 72446 to find a contact whose name spells it).
            - Dialpad rebuilt like Google Dialer: ripple keys, DTMF tones, haptics, live
              contact suggestions while typing, Paste/Copy/Clear, + key, and a backspace
              that only appears when there is a number to delete.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
