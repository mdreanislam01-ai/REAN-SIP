name: Build CallerX APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'CallerX.html'
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 25 build.log
            summary=$(grep -E -i -A2 -B1 'e: |error:|unresolved reference|type mismatch|cannot infer|overload resolution|not enough information|cannot access|what went wrong|execution failed' build.log | head -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::$summary"
            exit "$result"
          fi
          tail -n 25 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CallerX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callerx-v1.5.17
          name: CallerX Android APK v1.5.17
          target_commitish: ${{ github.sha }}
          body: |
            Installable CallerX Android debug APK.

            v1.5.17 — headset audio fixed + add call / conference:
            - Headphone audio now works during SIP calls: routing uses the Android
              AudioManager communication devices (Bluetooth SCO, wired/USB headset, earpiece,
              speaker) and re-routes automatically when a headset is plugged in or a Bluetooth
              device connects mid-call. A "Headset" chip shows when it is the active route.
            - New "Add call" button on the call screen: holds the current call and dials a
              second number. With two calls the screen lists both with Swap and Merge, and
              Merge puts everyone in one SIP conference call.

            v1.5.16 — polish pack: photos, badge, speed dial, live timer, signing:
            - Contact photos in recents and contacts (initials only as a fallback).
            - Missed-call badge (last 24 h) on the Calls tab of the bottom bar.
            - Live call timer in the ongoing-call notification (chronometer, no battery cost).
            - Tap the header chip for a SIP status popup: account, server:port, transport,
              online/offline and the registration message.
            - Speed dial: pick 1-9 from any recent call's ⋮ menu, then hold that key in the
              dial pad to call it (hold 0 still types "+").
            - Recent searches appear as chips under the search bar; tap to search again.
            - Dark mode now uses a darker shade of the accent for the header.
            - Registration retries back off 10 s → 20 s → 40 s → 80 s (max 120 s) instead of
              hitting the server every 20 s.
            - Silent weekly backup to phone storage.
            - Release signing support: drop keystore.properties in the repo root (see
              keystore.properties.example); release builds then use your own key.

            v1.5.15 — SIP account chip, Profile & Backup, calmer scrolling:
            - The chip on the right of the header shows the SIP account's own name (green dot
              when registered, amber while it is still connecting) and "Offline" when no SIP
              account has been added, instead of the generic "Online".
            - Settings → "Profile & Backup Account" (was "My Profile & User Account") now has real
              backup: "Backup with Google account" opens the phone's Google account picker and
              registers the backup with Android's Google Drive backup; "Backup to phone storage"
              writes a readable JSON file in Downloads/CallerX. "Restore" brings SIP accounts,
              blocked numbers, favourites, theme and profile back.
            - Call history, contacts and messages scroll with calmer fling physics, so a flick no
              longer races past the number you are looking for.

            v1.5.14 — Dialpad header uses the app theme colour:
            - The white strip at the top of the dial pad (status bar + CallerX row) is now
              painted with the app theme colour, exactly like the home header, so the whole
              top of the screen looks like one piece. The clock / Wi-Fi / battery icons are
              white on it and stay readable.
            - The theme colour setting still applies everywhere.

            v1.5.13 — Dialpad number box moved above the keypad:
            - The typed number now sits in its own rounded box just above the keypad (where
              your screenshot marked it), with copy on the left and backspace on the right,
              instead of being pinned to the very top of the screen.
            - Press and hold that box to paste a copied number (the extra Paste button in the
              top bar was removed). A small "press and hold to paste" hint shows while empty.
            - The app heading "CallerX" stays visible at the top in a light, subtle style with
              the back arrow.
            - Contact suggestions still list the matching numbers between the heading and the
              number box, and tapping one fills it in.
            - Status bar icons now follow the screen colour properly (dark icons on the light
              dialer, white icons on the coloured header).

            v1.5.12 — Header, status bar and Truecaller-style dialpad:
            - Header is now three clean lines: "CallerX", "SIM 1 · SIM 2 · SIP", then one
              full-width search bar inside the coloured header. The right side shows only
              "Online" / "Offline" (no more "SIP Online" chip overlapping the title).
            - The status bar (clock, wifi, battery) is painted with the app theme colour
              instead of a white strip, so the icons are always readable and the top of the
              screen looks like part of the app. The dialer keeps a light bar with dark icons.
            - No more double status-bar padding on Android 15 (that white gap above the header).
            - Dialpad rebuilt like Truecaller: paste icon top-right, copy icon left of the
              number, backspace right of it (long-press clears everything), contact name above
              the number, flat keys with DTMF tones and haptics, and the green call button
              centred at the bottom.
            - Call-history filter chips scroll sideways so the Clear button no longer wraps.
            - Audio routing respects a connected Bluetooth / wired headset (SCO started) and
              the speaker toggle.

            v1.5.11 — Lock-screen mic, network drops, search & dialpad (Google Dialer style):
            - SIP engine now lives in the foreground service (microphone type), not in the
              Activity, so locking the phone, minimising the app or the system killing the
              Activity no longer kills the call or the microphone. Incoming SIP calls show a
              full-screen call UI over the lock screen and can be answered from there.
            - Audio focus + MODE_IN_COMMUNICATION + wake/Wi-Fi locks are held from the first
              ring until the call ends; Bluetooth / wired headset audio routing is honoured.
            - SIP re-registers automatically after reboot (boot receiver) and on every
              Wi-Fi/mobile switch; keepalive tightened to 15 s, registration refresh every
              5 minutes, and Opus switched to mono 16 kHz so calls survive weak 4G.
            - Search bar fixed: text keyboard on every tab (was numeric on Calls, so names
              could not be typed), auto-focus, +880/880/00/0 number equivalence, and real
              T9 keypad search (type 72446 to find a contact whose name spells it).
            - Dialpad rebuilt like Google Dialer: ripple keys, DTMF tones, haptics, live
              contact suggestions while typing, Paste/Copy/Clear, + key, and a backspace
              that only appears when there is a number to delete.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
