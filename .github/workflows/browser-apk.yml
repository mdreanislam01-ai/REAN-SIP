name: Build REAN Browser APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'browser/**'
      - '.github/workflows/browser-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 40 build.log
            errors=$(grep -E 'e: |What went wrong|Could not|error:|FAILURE' -A2 build.log | sed 's#https://[^ ]*##g' | cut -c1-240)
            printf '%s\n' "$errors" | head -n 60 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
          tail -n 5 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: REAN-Browser-debug-apk
          path: browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
